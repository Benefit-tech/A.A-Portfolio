<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Your Name</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <nav>
      <a href="index.html" class="logo">Your Name</a>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="planner.html">Planner</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1 class="page-title">Contact Me</h1>

    <!-- novalidate turns off the browser's own checks so OUR JavaScript does the validation -->
    <form id="contactForm" class="contact-form" novalidate>

      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Your full name">
      <p class="error" id="nameError"></p>

      <label for="email">Email Address</label>
      <input type="text" id="email" placeholder="you@example.com">
      <p class="error" id="emailError"></p>

      <label for="phone">Phone Number</label>
      <input type="text" id="phone" placeholder="08012345678">
      <p class="error" id="phoneError"></p>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Type your message here"></textarea>
      <p class="error" id="messageError"></p>

      <button type="submit" class="btn">Send Message</button>
      <p id="formMessage"></p>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Your Name. All rights reserved.</p>
  </footer>

  <script src="contact.js"></script>
</body>
</html>
